
name: Build CloneX Infinity APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CloneXInfinityBasic.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q CloneXInfinityBasic.zip -d source

      - name: Fix Java and Kotlin JVM targets
        run: |
          cd source/CloneXInfinityBasic
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          needle = "    buildFeatures { compose = true }"

          block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if needle not in s:
                  raise SystemExit("Could not find buildFeatures line")
              s = s.replace(needle, block + "\n" + needle)

          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd source/CloneXInfinityBasic
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneXInfinity-debug-APK
          path: source/CloneXInfinityBasic/app/build/outputs/apk/debug/*.apk


name: Build CloneX Infinity APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CloneXInfinityBasic.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          unzip -q CloneXInfinityBasic.zip -d source
          cd source/CloneXInfinityBasic
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneXInfinity-debug-APK
          path: source/CloneXInfinityBasic/app/build/outputs/apk/debug/*.apk
